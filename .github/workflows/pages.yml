name: Déploiement GitHub Pages (MkDocs Material)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'architecture.md'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch: # Déclenchement manuel via l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Compilation et Déploiement MkDocs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation de MkDocs, du thème Material et des plugins
        run: |
          pip install mkdocs-material mkdocs-include-markdown-plugin

      - name: 🔨 Compilation du site statique avec MkDocs
        run: |
          mkdocs build

      - name: ⚙️ Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Téléversement de l'artefact (dossier site/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'

      - name: 🚀 Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
